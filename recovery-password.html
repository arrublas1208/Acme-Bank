<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/newpassword.css">
    <link rel="icon" href="assets/img/icon-bank.png" type="image/x-icon">
    <title>RECOVERY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <body>
    <div class="outer-container">
        <div class="container">
            <div class="login-container"> 
                <img src="assets/img/tex-logo.png" alt="" class="logo">   
                <h1>Create new password</h1>
                <p class="parrf">Enter a new password for your account</p>
                
                <div class="input-container">
                    <input type="password" placeholder="New password" id="new-password" class="input">
                    <span class="toggle-password" data-target="new-password">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
               
                <div class="input-container">
                    <input type="password" placeholder="Confirm new password" id="new-password1" class="input">
                    <span class="toggle-password" data-target="new-password1">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                
                <p id="password-match-message" style="color: red; font-size: 0.9em; margin-top: 10px; margin-bottom: 15px; text-align: left;"></p>

                <br>
                <button class="sign" id="reset-password-btn"><strong>Reset password</strong></button>
                <br>
            </div>
            <div class="right-photo"><img src="assets/img/padlock.png" alt=""></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCN8zBw644x9hrZngHpNYf01hY2UcENiTE",
        authDomain: "acme-bank-15f4a.firebaseapp.com",
        databaseURL: "https://acme-bank-15f4a-default-rtdb.firebaseio.com",
        projectId: "acme-bank-15f4a",
        storageBucket: "acme-bank-15f4a.firebasestorage.app",
        messagingSenderId: "575284743206",
        appId: "1:575284743206:web:9d38f5c7b7a9112092eae7",
        measurementId: "G-LSMBCTG4EK"
      };
      
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth(); 
      
    document.addEventListener('DOMContentLoaded', () => {
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('new-password1'); 
    const togglePasswordButtons = document.querySelectorAll('.toggle-password');
    const passwordMatchMessage = document.getElementById('password-match-message');
    const resetPasswordBtn = document.getElementById('reset-password-btn');

    togglePasswordButtons.forEach(button => {
        button.addEventListener('click', () => {
            const targetId = button.dataset.target;
            const targetInput = document.getElementById(targetId);
            const icon = button.querySelector('i');

            if (targetInput.type === 'password') {
                targetInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                targetInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });

    const checkPasswordsMatch = () => {
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword === '' && confirmPassword === '') {
            passwordMatchMessage.textContent = '';
            return false;
        }

        if (newPassword === confirmPassword) {
            passwordMatchMessage.textContent = 'Passwords match.';
            passwordMatchMessage.style.color = 'green';
            return true;
        } else {
            passwordMatchMessage.textContent = 'Passwords do not match.';
            passwordMatchMessage.style.color = 'red';
            return false;
        }
    };

    newPasswordInput.addEventListener('input', checkPasswordsMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordsMatch);

    resetPasswordBtn.addEventListener('click', async (event) => { 
        event.preventDefault();

        if (checkPasswordsMatch()) {
            const newPassword = newPasswordInput.value;
            const user = auth.currentUser;

            if (user) {
                try {
                    await user.updatePassword(newPassword);
                    alert('Contraseña restablecida con éxito.');
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error("Error al restablecer la contraseña:", error.message);
                    alert("Error al restablecer la contraseña: " + error.message);
                }
            } else {
                alert('No hay usuario autenticado. Por favor, inicia sesión para restablecer la contraseña.');

            }
        }
    });
    
    checkPasswordsMatch();
});
    
    </script>
    
    
</body>
</html>
