<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="assets/img/icon-bank.png" type="image/x-icon">
    <title>ACME BANK</title>
</head>
<body>
    <div class="outer-container">
        <div class="container">
            <div class="login-container"> 
                <img src="assets/img/tex-logo.png" alt="" class="logo">   
                <h1>Sign in to<br>your account</h1>
                <select id="identification-r">
                    <option value="" hidden selected>Type of identification</option>
                    <option value="Id">Id</option>
                    <option value="passport">Passport</option>
                    <option value="tin">Tin</option>
                    <option value="civil-reg">Civil registry</option>
                    <option value="diploatic-card">Diploatic card</option>
                </select>
                <input type="text" placeholder="Identification number" id="identification" class="input">
                <input type="password" placeholder="Password" id="password" class="input">
                <a href="recovery-email.html">Forgot password?</a>
                <button class="sign" id="sign-in"><strong>Sign in</strong></button>
                <br>
                <p>Don't have an account?<a href=""><strong>Sign up</strong></a></p>
            </div>
            <div class="right-photo"><img src="assets/img/phone-hand.png" alt=""></div>
        </div>
    </div>
</body>
</html>
