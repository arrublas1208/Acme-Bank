<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" href="assets/img/icon-bank.png" type="image/x-icon">
</head>
<body>
    <div class="outer-container">
        <div class="container">
            <div class="left-side"> 
                <div class="logo">
                    <img src="assets/img/tex-logo-white.png" alt="ACME Bank Logo">
                </div>
                
                <div class="menu-container">
                    <div class="menu-item">
                        <img src="assets/img/transactions.png" alt="">Transaction <br> summary
                    </div>
                    <div class="menu-item">
                        <img src="assets/img/wallet-pass.png" alt="">Electronic <br> Deposit
                    </div>
                    <div class="menu-item">
                        <img src="assets/img/withdraw.png" alt="">Money <br> withdrawal
                    </div>
                    <div class="menu-item">
                        <img src="assets/img/services.png" alt="">Utility Bill <br> Payment
                    </div>
                    <div class="menu-item">
                        <img src="assets/img/bank-state.png" alt="">Bank statement
                    </div>
                    <div class="menu-item">
                        <img src="assets/img/bank-certificate.png" alt="">
                        <span>Bank certificate</span>
                    </div>
                    
                    <div class="menu-item1 logout">
                        <img src="assets/img/log-out.png" alt="">
                        <span>Log out</span>
                    </div>
                </div>
            </div>
            <div class="right-side"></div>
        </div>    
    </div> 
</body>
</html>
